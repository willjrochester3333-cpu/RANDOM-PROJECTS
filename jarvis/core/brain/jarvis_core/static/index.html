<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S.</title>
<style>
:root { --bg:#0b1420; --panel:#132033; --line:#26374f; --ink:#e6edf6; --muted:#8fa1b8; --amber:#f0b23a; --ok:#4cc38a; --bad:#e5604d; }
* { box-sizing:border-box; }
html, body { height:100%; margin:0; }
body { background:var(--bg); color:var(--ink); font:16px/1.4 system-ui, "Segoe UI", sans-serif; display:flex; flex-direction:column; gap:12px; padding:14px; -webkit-user-select:none; user-select:none; }
header { display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
header h1 { margin:0; font-size:1.1rem; letter-spacing:.3em; color:var(--amber); font-weight:600; }
#clock { font-size:2rem; font-variant-numeric:tabular-nums; font-weight:300; }
#link { font-size:.8rem; color:var(--muted); }
main { flex:1; display:grid; grid-template-columns:1.3fr 1fr; gap:12px; min-height:0; }
main.has-cam { grid-template-columns:1fr 1.25fr 1fr; }
main.has-cam #nodes { grid-template-columns:1fr; }
.camhead { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.camhead .label { margin-right:auto; }
button.chip { padding:5px 12px; font-size:.8rem; font-weight:500; border-radius:999px; background:transparent; color:var(--muted); border:1px solid var(--line); }
button.chip.on { color:#1a1305; background:var(--amber); border-color:var(--amber); }
#camview { cursor:zoom-in; }
#camview { position:relative; flex:1; min-height:0; background:#000; border-radius:6px; overflow:hidden; display:flex; align-items:center; justify-content:center; }
#cam { width:100%; height:100%; object-fit:contain; display:block; }
#camnote { position:absolute; inset:auto 0 0 0; padding:6px 10px; font-size:.85rem; color:var(--muted); background:rgba(8,14,22,.7); }
#camnote:empty { display:none; }
#campanel.big { position:fixed; inset:0; z-index:5; border-radius:0; border:0; background:#000; padding:0; }
#campanel.big .camhead { position:absolute; top:10px; right:10px; z-index:6; }
#campanel.big .label { display:none; }
#campanel.big #camview { cursor:zoom-out; }
#campanel.big #camview { border-radius:0; }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; display:flex; flex-direction:column; gap:10px; min-width:0; min-height:0; }
.label { font-size:.72rem; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
#temp { font-size:5rem; font-weight:200; line-height:1; font-variant-numeric:tabular-nums; }
#temp small { font-size:1.6rem; color:var(--muted); }
.pair { display:flex; gap:28px; font-size:1.25rem; font-variant-numeric:tabular-nums; }
.pair span { color:var(--muted); font-size:.8rem; display:block; }
#age { font-size:.8rem; color:var(--muted); }
#age.stale { color:var(--bad); }
#spark { width:100%; flex:1; min-height:60px; }
#spark polyline { fill:none; stroke:var(--amber); stroke-width:2; vector-effect:non-scaling-stroke; }
#range { font-size:.75rem; color:var(--muted); display:flex; justify-content:space-between; }
#nodes { display:grid; grid-template-columns:1fr 1fr; gap:6px 14px; font-size:.95rem; }
.node { display:flex; align-items:center; gap:8px; }
.dot { width:10px; height:10px; border-radius:50%; background:var(--line); flex:none; }
.dot.on { background:var(--ok); } .dot.off { background:var(--bad); }
#log { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:8px; font-size:.95rem; min-height:60px; }
#log .me { color:var(--muted); } #log .j { color:var(--ink); }
#log .live::after { content:"\25CD"; color:var(--amber); margin-left:4px; animation:blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity:0; } }
@media (prefers-reduced-motion: reduce) { #log .live::after { animation:none; } }
form { display:flex; gap:8px; }
input[type=text] { flex:1; min-width:0; background:var(--bg); border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:12px; font-size:1rem; -webkit-user-select:text; user-select:text; }
button { background:var(--amber); color:#1a1305; border:0; border-radius:8px; padding:12px 18px; font-size:1rem; font-weight:600; cursor:pointer; }
button.quiet { background:transparent; color:var(--muted); border:1px solid var(--line); font-weight:400; }
button.talk { background:transparent; color:var(--amber); border:1px solid var(--amber); }
button.talk.live { background:var(--amber); color:#1a1305; }
#voice { font-size:.85rem; color:var(--muted); min-height:1.2em; }
#voice.on { color:var(--amber); }
button:focus-visible, input:focus-visible { outline:2px solid var(--amber); outline-offset:2px; }
#dinner { position:fixed; inset:0; z-index:10; background:rgba(8,14,22,.94); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px; text-align:center; padding:24px; }
#dinner h2 { margin:0; font-size:clamp(2.4rem, 9vw, 5rem); font-weight:300; color:var(--amber); }
#dinner p { margin:0; font-size:1.3rem; color:var(--muted); }
#dinner button { font-size:1.6rem; padding:22px 44px; border-radius:14px; }
#dinner.acked h2 { color:var(--ok); }
[hidden] { display:none !important; }
@media (max-width:700px) { main, main.has-cam { grid-template-columns:1fr; } #camview { aspect-ratio:4/3; flex:none; } #temp { font-size:3.6rem; } body { height:auto; } }
</style>
</head>
<body>
<header>
  <h1>J.A.R.V.I.S.</h1>
  <span id="link">connecting…</span>
  <span id="clock">--:--</span>
</header>

<main>
  <section class="panel">
    <span class="label">Outside</span>
    <div id="temp">--<small>°C</small></div>
    <div class="pair">
      <div><span>Humidity</span><b id="hum">--</b> %</div>
      <div><span>Pressure</span><b id="pres">--</b> hPa</div>
    </div>
    <div id="age">No reading yet</div>
    <svg id="spark" viewBox="0 0 100 40" preserveAspectRatio="none"><polyline points=""/></svg>
    <div id="range"><span>24 hours ago</span><span id="minmax"></span><span>now</span></div>
  </section>

  <section class="panel" id="campanel" hidden>
    <div class="camhead">
      <span class="label" id="camlabel">Camera</span>
      <span id="camtabs"></span>
      <button type="button" class="chip" id="listen" hidden title="Hear this camera's microphone">Listen</button>
    </div>
    <div id="camview" title="Tap to enlarge"><img id="cam" alt="Live camera"><span id="camnote"></span></div>
    <audio id="camsound" preload="none"></audio>
  </section>

  <section class="panel">
    <span class="label">Devices</span>
    <div id="nodes"></div>
    <span class="label">Ask</span>
    <div id="log"></div>
    <div id="voice"></div>
    <form id="ask">
      <input type="text" id="q" placeholder="Ask J.A.R.V.I.S." autocomplete="off" maxlength="2000">
      <button type="submit">Send</button>
      <button type="button" class="talk" id="talk" title="Listen on the server's microphone">Talk</button>
    </form>
    <button class="quiet" id="call" type="button">Call dinner from here</button>
  </section>
</main>

<div id="dinner" hidden>
  <h2 id="dtitle">Dinner is ready</h2>
  <p id="dsub"></p>
  <button id="ack" type="button">On my way</button>
  <button id="dismiss" class="quiet" type="button" hidden>Dismiss</button>
</div>

<script>
const $ = id => document.getElementById(id);
const NODES = ["core", "console", "outpost", "kitchen", "beacon"];
let dismissedSince = null;

function tick() { $("clock").textContent = new Date().toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"}); }
setInterval(tick, 1000); tick();

function render(s) {
  const w = s.weather;
  if (w) {
    $("temp").firstChild.textContent = w.temp_c.toFixed(1);
    $("hum").textContent = Math.round(w.humidity);
    $("pres").textContent = Math.round(w.pressure_hpa);
    const mins = Math.round(w.age_s / 60);
    $("age").textContent = w.stale ? `Last reading ${mins} min ago: check the outdoor station` : "Updated " + (mins < 1 ? "just now" : mins + " min ago");
    $("age").className = w.stale ? "stale" : "";
  }
  renderCamera(s);
  const names = NODES.concat(Object.keys(s.nodes).filter(n => NODES.indexOf(n) < 0));
  $("nodes").replaceChildren(...names.map(n => {
    const st = s.nodes[n], d = document.createElement("div");
    d.className = "node";
    const dot = document.createElement("span");
    dot.className = "dot " + (st ? (st.online ? "on" : "off") : "");
    d.append(dot, n + (st ? (st.online ? "" : " (offline)") : " (never seen)"));
    return d;
  }));
  const d = s.dinner, box = $("dinner");
  const show = d.state !== "idle" && dismissedSince !== d.since;
  box.hidden = !show;
  box.className = d.state === "acknowledged" ? "acked" : "";
  $("dtitle").textContent = d.state === "acknowledged" ? "On your way" : "Dinner is ready";
  $("dsub").textContent = d.state === "acknowledged" ? "The kitchen button is now lit steady." : "The kitchen button is blinking until you answer.";
  $("ack").hidden = d.state !== "calling";
  $("dismiss").hidden = d.state !== "acknowledged";
  $("dismiss").onclick = () => { dismissedSince = d.since; box.hidden = true; };
}

// Live cameras. A stream is only (re)connected when its address changes or the camera
// comes back online, never on ordinary state updates.
let cams = {}, camNode = null, camKey = null, camUrl = null, lastState = null, listening = false;
const online = (s, n) => !!(s.nodes[n] && s.nodes[n].online);
const fresh = url => url + (url.includes("?") ? "&" : "?") + "r=" + Date.now();

function renderCamera(s) {
  lastState = s;
  cams = s.cameras || {};
  const names = Object.keys(cams);
  $("campanel").hidden = names.length === 0;
  document.querySelector("main").classList.toggle("has-cam", names.length > 0);
  if (!cams[camNode]) camNode = names.find(n => online(s, n)) || names[0] || null;
  $("camtabs").replaceChildren(...(names.length > 1 ? names : []).map(n => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip" + (n === camNode ? " on" : ""); b.textContent = cams[n].name;
    b.onclick = () => { if (n !== camNode) { stopSound(); camNode = n; camKey = null; renderCamera(lastState); } };
    return b;
  }));
  const cam = cams[camNode];
  $("camlabel").textContent = cam ? cam.name : "Camera";
  $("listen").hidden = !(cam && cam.audio);
  if (!cam || !online(s, camNode)) {
    stopCamera(cam ? cam.name + " offline" : "");
    stopSound();
    return;
  }
  const key = camNode + "|" + cam.video + "|" + s.nodes[camNode].since;
  if (key === camKey) return;
  camKey = key; camUrl = cam.video;
  $("camnote").textContent = "Connecting…";
  $("cam").src = camUrl;
  if (listening) startSound();
}
function stopCamera(note) {
  camKey = camUrl = null;
  $("cam").removeAttribute("src");
  $("camnote").textContent = note;
  $("campanel").classList.remove("big");
}
$("cam").onload = () => { $("camnote").textContent = ""; };
$("cam").onerror = () => {
  if (!camUrl) return;
  $("camnote").textContent = "Reconnecting…";
  const url = camUrl;
  setTimeout(() => { if (camUrl === url) $("cam").src = fresh(url); }, 3000);
};
$("camview").onclick = () => { if (camUrl) $("campanel").classList.toggle("big"); };
document.addEventListener("keydown", e => { if (e.key === "Escape") $("campanel").classList.remove("big"); });

// Sound from a camera's microphone: off until someone taps Listen.
function startSound() {
  const cam = cams[camNode];
  if (!cam || !cam.audio) return;
  const a = $("camsound");
  a.src = fresh(cam.audio);
  listening = true;
  $("listen").textContent = "Mute"; $("listen").classList.add("on");
  a.play().catch(() => { stopSound(); $("camnote").textContent = "Tap Listen to hear it"; });
}
function stopSound() {
  const a = $("camsound");
  a.pause(); a.removeAttribute("src"); a.load();
  listening = false;
  $("listen").textContent = "Listen"; $("listen").classList.remove("on");
}
$("listen").onclick = () => { listening ? stopSound() : startSound(); };
$("camsound").onerror = () => { if (listening) setTimeout(() => { if (listening) startSound(); }, 3000); };

function line(cls, text) {
  const p = document.createElement("div"); p.className = cls; p.textContent = text;
  $("log").append(p); $("log").scrollTop = 1e9;
  return p;
}

// Answers appear sentence by sentence while they are written, then the final text replaces them.
let live = null;
function startAnswer(question) {
  if (live) live.classList.remove("live");
  line("me", question);
  live = line("j live", "");
}
function addToAnswer(text) {
  if (!live) live = line("j live", "");
  live.textContent += (live.textContent ? " " : "") + text;
  $("log").scrollTop = 1e9;
}
function finishAnswer(m) {
  if (live) { live.textContent = m.reply; live.classList.remove("live"); live = null; }
  else { line("me", m.text); line("j", m.reply); }
}

function connect() {
  const ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  ws.onopen = () => { $("link").textContent = "online"; loadHistory(); };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === "state") render(m.state);
    else if (m.type === "partial") addToAnswer(m.text);
    else if (m.type === "chat") finishAnswer(m);
    else if (m.type === "voice") {
      if (m.state === "thinking" && m.text) startAnswer(m.text);
      voiceState(m);
    }
  };
  ws.onclose = () => { $("link").textContent = "reconnecting…"; setTimeout(connect, 3000); };
}
connect();

async function post(path, body) {
  const r = await fetch(path, {method: "POST", headers: {"Content-Type": "application/json"}, body: body ? JSON.stringify(body) : null});
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

const VOICE_TEXT = {listening: "Listening…", thinking: "Thinking…", speaking: "Speaking…", idle: ""};
let voiceTimer = null;
function voiceState(m) {
  const el = $("voice");
  el.textContent = (VOICE_TEXT[m.state] || "") + (m.state === "thinking" && m.text ? " " + m.text : "");
  el.className = m.state === "idle" ? "" : "on";
  $("talk").classList.toggle("live", m.state === "listening");
  // While Jarvis thinks or talks, the Talk button stops him instead.
  $("talk").textContent = m.state === "thinking" || m.state === "speaking" ? "Stop" : "Talk";
  clearTimeout(voiceTimer);
  if (m.state !== "idle") voiceTimer = setTimeout(() => voiceState({state: "idle"}), 60000);
}
$("talk").onclick = () => {
  const path = $("talk").textContent === "Stop" ? "/api/voice/stop" : "/api/listen";
  post(path).catch(() => line("j", "The server did not answer. Is CORE running?"));
};
$("ack").onclick = () => post("/api/dinner/ack").catch(() => {});
$("call").onclick = () => post("/api/dinner/call").catch(() => {});
$("ask").onsubmit = async e => {
  e.preventDefault();
  const text = $("q").value.trim(); if (!text) return;
  $("q").value = "";
  // The question and answer arrive back as a "chat" event, so every open dashboard shows them.
  try { await post("/api/chat", {text, speak: true, source: "typed"}); }
  catch { line("j", "The server did not answer. Is CORE running?"); }
};

async function loadHistory() {
  try {
    const rows = await (await fetch("/api/weather/history?hours=24")).json();
    if (rows.length < 2) return;
    const t = rows.map(r => r.temp_c), lo = Math.min(...t), hi = Math.max(...t), span = (hi - lo) || 1;
    const t0 = rows[0].ts, t1 = rows[rows.length - 1].ts, dt = (t1 - t0) || 1;
    $("spark").firstElementChild.setAttribute("points",
      rows.map(r => `${((r.ts - t0) / dt * 100).toFixed(2)},${(38 - (r.temp_c - lo) / span * 36).toFixed(2)}`).join(" "));
    $("minmax").textContent = `low ${lo.toFixed(1)}° · high ${hi.toFixed(1)}°`;
  } catch {}
}
setInterval(loadHistory, 300000);
// keep "updated n min ago" fresh between readings
setInterval(() => fetch("/api/state").then(r => r.json()).then(render).catch(() => {}), 60000);
</script>
</body>
</html>
